<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eyewear Lens Technology · ILG Academy</title>
<meta name="description" content="ILG Academy training deck: polarised lenses, lens coatings and technologies, lens anatomy, care, consultation and assessment.">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

/* Calibre theme: paper, ink, gold · Cormorant Garamond + Inter */
:root{--paper:#F6F3EE;--surface:#FBFAF7;--raise:#EFEBE4;--ink:#16140F;--text:#3B362F;--mute:#7A7366;--faint:#A59E91;--line:#E1DBD0;--gold:#8A6B32;--gold2:#C9A24E;--on-ink:#F6F3EE;--note:#F3EEE4;
  --serif:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E9E4DA;color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
/* the 16:9 slide box; sizes in cqw so the 3D renders sharp at any screen size */
.deck{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);background:var(--paper);container-type:size;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.slide{position:absolute;inset:0;display:grid;opacity:0;pointer-events:none;transition:opacity .35s ease,transform .45s ease;transform:translateX(1.2cqw)}
.slide.on{opacity:1;pointer-events:auto;transform:none}
.slide.out{transform:translateX(-1.2cqw)}
@media (prefers-reduced-motion:reduce){.slide{transition:none;transform:none}}
/* frame */
.top{position:absolute;left:3.6cqw;right:3.6cqw;top:2.6cqw;display:flex;justify-content:space-between;align-items:center;font-size:.78cqw;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);z-index:3}
.top .logo{height:1.9cqw;opacity:.9}
.foot{position:absolute;left:3.6cqw;right:3.6cqw;bottom:2.2cqw;display:flex;justify-content:space-between;align-items:center;font-size:.72cqw;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);z-index:3}
.foot .dot{display:inline-block;width:.6cqw;height:.6cqw;border-radius:50%;background:var(--faint);margin-right:.5cqw;vertical-align:middle}
.foot .dot.on{background:#3E7A4A}
.bar{position:absolute;left:0;bottom:0;height:.28cqw;background:var(--gold);transition:width .4s;z-index:3}
/* type */
.eyebrow{font-size:.85cqw;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin:0 0 .8cqw}
h1,h2{font-family:var(--serif);font-weight:500;color:var(--ink);margin:0}
h1{font-size:5.4cqw;line-height:1.02}
h2{font-size:3.3cqw;line-height:1.05}
.lead{font-size:1.45cqw;line-height:1.5;margin:1.2cqw 0 0;max-width:44cqw}
p{margin:0}
/* layouts */
.L-title{grid-template-columns:44cqw 1fr;align-items:center;padding:0 3.6cqw}
.L-split{grid-template-columns:57cqw 1fr;gap:2.4cqw;padding:6.2cqw 3.6cqw 5.6cqw}
.L-center{place-items:center;text-align:center;padding:6cqw}
.L-list{grid-template-columns:1fr 1fr;gap:3cqw;padding:7cqw 3.6cqw 6cqw;align-content:center}
.fig{position:relative;border:1px solid var(--line);background:var(--surface);min-height:0;overflow:hidden}
.fig iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
.fig .lbl{position:absolute;left:1.1cqw;top:.9cqw;font-size:.7cqw;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);z-index:2;pointer-events:none}
.side{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.side .lv{display:inline-block;font-size:.72cqw;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);padding:.25cqw .6cqw;margin-left:.8cqw;vertical-align:middle}
.sec{font-size:.78cqw;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:1.5cqw 0 .45cqw;font-weight:600}
.txt{font-size:1.32cqw;line-height:1.5;color:var(--text)}
.txt b{color:var(--ink);font-weight:600}
.types{display:grid;gap:.35cqw;margin-top:.4cqw}
.types p{font-size:1.12cqw;line-height:1.4}
.types b{font-weight:600;color:var(--ink)}
.say{font-family:var(--serif);font-style:italic;font-size:1.75cqw;line-height:1.3;color:var(--gold)}
.more{opacity:0;transform:translateY(.6cqw);transition:opacity .4s,transform .4s}
.more.show{opacity:1;transform:none}
.steps{margin-top:auto;display:flex;flex-wrap:wrap;gap:.45cqw;padding-top:1cqw}
.steps button{font-size:.72cqw;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);background:var(--surface);color:var(--mute);padding:.45cqw .7cqw;cursor:pointer;border-radius:0}
.steps button.done{border-color:var(--gold);color:var(--gold)}
.steps button.next{border-color:var(--ink);color:var(--ink)}
.kv{display:grid;grid-template-columns:9.5cqw 1fr;gap:.35cqw 1cqw;font-size:1.02cqw;border-top:1px solid var(--line);padding-top:.7cqw;margin-top:.2cqw}
.kv dt{font-size:.7cqw;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);padding-top:.2cqw}
.kv dd{margin:0;color:var(--ink)}
/* agenda / lists */
.agenda{display:grid;gap:1.1cqw;margin-top:2cqw}
.agenda div{display:grid;grid-template-columns:4cqw 1fr;align-items:baseline;border-top:1px solid var(--line);padding-top:1cqw}
.agenda b{font-family:var(--serif);font-size:2.6cqw;font-weight:500;color:var(--gold)}
.agenda span{font-size:1.4cqw;color:var(--ink)}
.agenda small{display:block;font-size:1cqw;color:var(--mute);margin-top:.2cqw}
.keys{display:grid;grid-template-columns:auto 1fr;gap:.55cqw 1.1cqw;font-size:1.08cqw;align-content:start}
.keys kbd{font-family:var(--sans);font-size:.85cqw;border:1px solid var(--ink);padding:.15cqw .5cqw;background:var(--surface);white-space:nowrap;justify-self:start}
.big{font-family:var(--serif);font-size:7.5cqw;line-height:1;color:var(--ink);font-weight:500}
.cta{display:inline-block;margin-top:2cqw;font-size:1.05cqw;letter-spacing:.16em;text-transform:uppercase;background:var(--ink);color:var(--on-ink);padding:1cqw 1.6cqw}
.qr{display:inline-block;background:#fff;padding:1cqw;border:1px solid var(--line)}
.qr svg{display:block;width:15cqw;height:15cqw}
/* crown panel and build picker on the slide */
.panel{display:flex;flex-wrap:wrap;gap:.5cqw;margin-top:.8cqw}
.panel button{font-size:.8cqw;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--ink);background:var(--surface);color:var(--ink);padding:.6cqw .9cqw;cursor:pointer;border-radius:0}
.panel button.ink,.panel button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.panel button:disabled{opacity:.4;cursor:default}
.crstate{font-size:1.1cqw;margin-top:.8cqw;color:var(--ink)}
.hint{font-size:1.05cqw;color:var(--gold);margin-top:.5cqw;min-height:3cqw}
/* overlays */
.black{position:fixed;inset:0;background:#000;z-index:50}
.ovl{position:fixed;inset:0;background:rgba(22,20,15,.55);z-index:47;display:grid;place-items:center;padding:3vw}
.ovl[hidden],.black[hidden]{display:none}
.sheet{background:var(--paper);max-width:min(980px,94vw);max-height:90vh;overflow:auto;padding:28px 30px;border:1px solid var(--line)}
.sheet h3{font-family:var(--serif);font-weight:500;font-size:30px;color:var(--ink);margin:0 0 6px}
.sheet p{font-size:15px;line-height:1.55;margin:0 0 10px}
.sheet .row{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.sheet .qr svg{width:220px;height:220px}
.sheet code{font-size:13px;background:var(--note);padding:2px 6px;word-break:break-all}
.sheet .x{float:right;border:1px solid var(--line);background:var(--surface);padding:6px 12px;cursor:pointer;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:12px}
.grid button{text-align:left;border:1px solid var(--line);background:var(--surface);padding:10px 12px;cursor:pointer;font-size:14px;border-radius:0}
.grid button.on{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.grid button small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);font-size:13px;letter-spacing:.06em;padding:10px 16px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}

/* ================= Caliber Remote (phone) and presenter view ================= */
.rmt{position:fixed;inset:0;overflow:auto;background:var(--paper);padding:14px 14px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;-webkit-user-select:none;user-select:none}
.rmt[hidden]{display:none}
.r-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.r-head .st{color:var(--mute);letter-spacing:.08em;text-transform:none;font-size:12px}
.r-head .st.ok{color:#3E7A4A}
.r-title{font-family:var(--serif);font-size:27px;line-height:1.1;color:var(--ink);margin:2px 0 0}
.r-sub{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.r-nav{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.r-nav button{min-height:74px;border:1px solid var(--ink);background:var(--surface);font-size:15px;letter-spacing:.14em;text-transform:uppercase;border-radius:0;touch-action:manipulation}
.r-nav button.go{background:var(--ink);color:var(--on-ink)}
.r-nav button small{display:block;font-size:11px;letter-spacing:.06em;text-transform:none;opacity:.75;margin-top:4px}
.pad{position:relative;height:200px;border:1px solid var(--line);background:var(--surface);touch-action:none;display:grid;place-items:center;color:var(--faint);font-size:12px;letter-spacing:.16em;text-transform:uppercase;text-align:center;line-height:1.7}
.pad[hidden]{display:none}
.r-acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.r-acts button{min-height:52px;border:1px solid var(--ink);background:var(--surface);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;border-radius:0;padding:4px 8px;touch-action:manipulation}
.r-acts button.ink,.r-acts button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.r-acts button.gold{border-color:var(--gold);color:var(--gold)}
.r-lab{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:4px 0 -4px}
.r-notes{font-size:15px;line-height:1.55;color:var(--ink);background:var(--note);border-left:3px solid var(--gold);padding:10px 12px}
.r-info{font-size:14px;color:var(--ink);min-height:20px}
.r-pair{display:grid;gap:10px}
.r-pair input{font:inherit;font-size:20px;letter-spacing:.2em;text-transform:uppercase;padding:12px;border:1px solid var(--ink);background:var(--surface);border-radius:0;width:100%}
.r-pair button{min-height:52px;border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);font-size:14px;letter-spacing:.14em;text-transform:uppercase;border-radius:0}
/* presenter view: wider, notes first */
.rmt.pres{display:grid;grid-template-columns:minmax(320px,1fr) minmax(340px,1.1fr);grid-auto-rows:min-content;gap:14px 22px;padding:22px 26px;align-content:start}
.rmt.pres .r-col{display:flex;flex-direction:column;gap:12px}
.rmt.pres .r-notes{font-size:18px}
.rmt.pres .r-title{font-size:34px}
.timer{font-family:var(--serif);font-size:44px;color:var(--ink);line-height:1}
.r-next{font-size:14px;color:var(--mute)}
.r-next b{color:var(--ink);font-weight:500}
.fstep button{font:inherit;font-size:.74cqw;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--ink);background:var(--surface);color:var(--ink);padding:.4cqw .8cqw;cursor:pointer;border-radius:0}
.fstep b{font-weight:600;color:var(--gold)}
.rmt>*{flex-shrink:0}

/* control bar */
.ctrl{position:fixed;left:50%;bottom:14px;transform:translate(-50%,8px);display:flex;align-items:center;gap:2px;background:rgba(22,20,15,.9);color:var(--on-ink);padding:5px;z-index:45;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:calc(100vw - 16px)}
.ctrl.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.ctrl button,.ctrl a{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;border:0;background:transparent;color:inherit;font:inherit;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none;border-radius:0;white-space:nowrap}
.ctrl button:hover,.ctrl a:hover,.ctrl button:focus-visible,.ctrl a:focus-visible{background:rgba(246,243,238,.14);outline:none}
.ctrl button:disabled{opacity:.35;cursor:default;background:transparent}
.ctrl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ctrl .nav{padding:0 12px}.ctrl .nav.go{background:var(--gold)}.ctrl .nav.go:hover{background:#9c7a3a}
.ctrl .cnt{font-size:12px;letter-spacing:.08em;min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
.ctrl .sep{width:1px;height:24px;background:rgba(246,243,238,.22);margin:0 4px}
@media (max-width:900px){.ctrl span:not(.cnt){display:none}.ctrl button,.ctrl a{padding:0 9px}}
@media (hover:none){.ctrl{bottom:max(10px,env(safe-area-inset-bottom))}}
.app.idle{cursor:none}
.app.idle .fig{cursor:auto}
.agenda .jump{cursor:pointer;transition:background .2s}
.agenda .jump:hover,.agenda .jump:focus-visible{background:var(--raise);outline:none}
.agenda .jump{position:relative;padding-right:3cqw}.agenda .jump::after{content:"›";position:absolute;right:1cqw;top:50%;transform:translateY(-35%);color:var(--gold);font-size:2.2cqw;font-family:var(--serif)}
.sheet .glab{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:16px 0 0;font-weight:600}
.sheet .grid{margin-top:8px}
.sheet .keys kbd{font-size:12px}
.sheet{width:min(980px,94vw)}
.r-head{flex-wrap:wrap;row-gap:6px}
.r-head .st{flex:1 1 100%;font-size:13px;line-height:1.45}


/* ===== Eyewear Lens Technology: additions to the shared Calibre deck theme ===== */
:root{--green:#3E7A4A;--red:#A9472F;--blue:#2F6B8F}
.top .wm{font-family:var(--serif);font-size:1.15cqw;letter-spacing:.22em;color:var(--ink);text-transform:uppercase}
.L-wide{grid-template-columns:64cqw 1fr;gap:2.2cqw;padding:6.2cqw 3.6cqw 5.6cqw}
.L-wide .txt,.L-split .side .txt{font-size:1.18cqw}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.fig-host{position:absolute;inset:0}
.fig.plain{border:0;background:transparent}
.side h2{font-size:2.7cqw}
.side .lead2{font-size:1.2cqw;line-height:1.45;margin-top:.7cqw;color:var(--text)}
[data-live]{margin-top:.2cqw}
.side a.ref,.wdg a.ref{font-size:.68cqw;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.tag{display:inline-block;font-size:.62cqw;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--gold);color:var(--gold);padding:.15cqw .45cqw;margin-left:.4cqw;vertical-align:middle;font-weight:600}
.kchip{display:inline-block;font-size:.6cqw;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--k);color:var(--k);padding:.12cqw .45cqw;margin-left:.3cqw;vertical-align:middle;font-weight:700;font-family:var(--sans)}
.side .kv{grid-template-columns:7.2cqw 1fr;font-size:1.02cqw}
.fb{font-size:1.02cqw;line-height:1.45;margin-top:.6cqw;padding:.5cqw .8cqw;border-left:3px solid var(--mute);background:var(--note);color:var(--ink)}
.fb.ok{border-color:var(--green)}.fb.no{border-color:var(--red)}.fb.mid{border-color:var(--gold2)}
.warn{margin:.3cqw 0 0;padding:0;list-style:none;font-size:.98cqw;line-height:1.4}
.warn li{padding-left:1.4cqw;position:relative;margin-top:.25cqw}.warn li::before{content:"!";position:absolute;left:0;top:0;width:1cqw;height:1cqw;border-radius:50%;background:var(--red);color:#fff;font-size:.66cqw;font-weight:700;text-align:center;line-height:1cqw}
.steps-ol{margin:.2cqw 0 .5cqw 1.2cqw;padding:0;font-size:1.05cqw;line-height:1.45}
.big-s{font-family:var(--serif);font-size:3.4cqw;line-height:1;color:var(--ink)}.big-s small{font-family:var(--sans);font-size:.9cqw;color:var(--mute);margin-left:.4cqw}
.note{font-size:.9cqw;line-height:1.45;color:var(--mute);margin-top:.8cqw;border-top:1px solid var(--line);padding-top:.5cqw}
.combo{margin:.2cqw 0 0;padding:0;list-style:none;font-size:.92cqw;line-height:1.4}.combo li{margin-top:.25cqw}
table.cat{border-collapse:collapse;font-size:.88cqw;width:100%;margin-top:.2cqw}table.cat th,table.cat td{border-bottom:1px solid var(--line);padding:.2cqw .4cqw;text-align:left}table.cat th{font-size:.62cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}table.cat tr.on td{background:var(--ink);color:var(--on-ink)}

/* ---- simulation frame: canvas + control strip ---- */
.sim{position:absolute;inset:0;display:flex;flex-direction:column}
.sim-cv{position:relative;flex:1;min-height:0;overflow:hidden}
.sim canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.sim-lab{position:absolute;right:.7cqw;top:.6cqw;margin:0;font-size:.6cqw;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:rgba(22,20,15,.55);padding:.25cqw .5cqw;pointer-events:none}
.sim-ui{display:flex;flex-wrap:wrap;gap:.45cqw 1.1cqw;align-items:center;padding:.6cqw .8cqw;border-top:1px solid var(--line);background:var(--surface)}
.seg{display:flex;align-items:center;gap:.22cqw;flex-wrap:nowrap}
.seg.wrap{flex-wrap:wrap;row-gap:.3cqw}
.seg-l{font-size:.58cqw;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-right:.25cqw;font-weight:700}
.seg button,.sbtn{font:inherit;font-size:.74cqw;letter-spacing:.04em;border:1px solid var(--ink);background:var(--surface);color:var(--ink);padding:.35cqw .6cqw;cursor:pointer;border-radius:0;min-height:2cqw;line-height:1.2}
.seg button[aria-pressed="true"],.sbtn.ink{background:var(--ink);color:var(--on-ink)}
.sbtn.ghost{border-color:var(--line);color:var(--mute)}
.sbtn:disabled{opacity:.4;cursor:default}
.sld{display:flex;align-items:center;gap:.45cqw;font-size:.72cqw}
.sld label{white-space:nowrap;color:var(--text)}.sld b{color:var(--gold);font-weight:700;display:inline-block;min-width:2.4cqw}
.sld input{width:8.5cqw;accent-color:#8A6B32;height:1.6cqw}

/* ---- DOM widgets inside the figure ---- */
.wdg{position:absolute;inset:0;overflow:auto;padding:1.4cqw 1.6cqw;background:var(--surface)}
.wdg h3{font-family:var(--serif);font-weight:500;font-size:2.1cqw;line-height:1.15;color:var(--ink);margin:.2cqw 0 .9cqw}
.wdg .eyebrow{margin-bottom:.3cqw}
.dz-btns{display:flex;flex-wrap:wrap;gap:.5cqw;margin-top:1cqw}
.dz-btns .sbtn{font-size:.9cqw;padding:.6cqw 1.1cqw;min-height:2.6cqw}
/* decision guide */
.decide{display:grid;grid-template-rows:auto 1fr;gap:1.2cqw}
.dz-card{border:1px solid var(--line);background:var(--paper);padding:1.6cqw 1.8cqw;border-left:4px solid var(--gold)}
.dz-card h3{font-size:2.4cqw}
.dz-card.stop{border-left-color:var(--red)}.dz-card.refer{border-left-color:var(--blue)}.dz-card.good{border-left-color:var(--green)}
.dz-notes{margin:.3cqw 0 0 1.1cqw;padding:0;font-size:1.05cqw;line-height:1.45}
.dz-path{list-style:none;margin:0;padding:0;display:grid;gap:.35cqw;align-content:start}
.dz-path li{display:flex;justify-content:space-between;gap:1cqw;font-size:.92cqw;border-bottom:1px solid var(--line);padding:.3cqw 0;color:var(--text)}
.dz-path li b{font-size:.7cqw;letter-spacing:.14em;text-transform:uppercase}.dz-path li.y b{color:var(--gold)}.dz-path li.n b{color:var(--mute)}
/* polarisation vs UV */
.uv-cols{display:grid;grid-template-columns:1fr 1fr;gap:1.2cqw}
.uv-col{border:1px solid var(--line);background:var(--paper);padding:.9cqw 1.1cqw}
.uv-col h4{font-family:var(--serif);font-weight:500;font-size:1.7cqw;margin:0 0 .4cqw;color:var(--ink)}
.uv-col ul{margin:.4cqw 0 0 1cqw;padding:0;font-size:.95cqw;line-height:1.45}
.spec{width:100%;height:auto;display:block}
.uv-rule{font-size:1.02cqw;margin:.9cqw 0;padding:.6cqw .9cqw;background:var(--ink);color:var(--on-ink);line-height:1.45}
.uv-rule a.ref{color:var(--gold2)}
.tfq{display:grid;grid-template-columns:1fr 1fr;gap:.7cqw}
.tf{border:1px solid var(--line);padding:.7cqw .9cqw;background:var(--paper)}.tf>p{font-size:1cqw;line-height:1.4;margin-bottom:.45cqw;color:var(--ink)}
.tf div{display:flex;gap:.4cqw}.tf.ok{border-color:var(--green)}.tf.no{border-color:var(--red)}
.tf .fb{font-size:.88cqw;margin-top:.45cqw}
/* myths */
.myths{display:grid;grid-template-columns:repeat(3,1fr);gap:.8cqw;align-content:start}
.myth{border:1px solid var(--line);background:var(--paper);padding:.9cqw 1cqw;display:flex;flex-direction:column;gap:.6cqw;min-height:9cqw}
.myth .ms{font-family:var(--serif);font-size:1.45cqw;line-height:1.2;color:var(--ink)}
.myth .mb{display:flex;gap:.4cqw;margin-top:auto}.myth .mb .sbtn{flex:1;font-size:.82cqw}
.myth .me{font-size:.92cqw;line-height:1.4}
.myth.done.ok{border-color:var(--green);box-shadow:inset 3px 0 0 var(--green)}.myth.done.no{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
/* anatomy explorer */
.anat{display:flex;flex-direction:column;padding:0}
.anat .concept{margin:0;padding:.55cqw 1cqw;font-size:.82cqw;letter-spacing:.06em;background:var(--ink);color:var(--on-ink)}
.xs-host{flex:1;min-height:0;display:grid;place-items:center;padding:.6cqw 1cqw}
.xsec{width:100%;height:100%;max-height:100%}
.xsec .lay{cursor:pointer}.xsec .lay:hover rect,.xsec .lay:focus rect{stroke:#8A6B32;stroke-width:3}.xsec .lay.sel rect{stroke:#8A6B32;stroke-width:4}
.xsec .lab{cursor:pointer}
/* comparison lab */
.compare{display:flex;flex-direction:column;gap:.6cqw}
.cmp-pre,.cmp-chips{display:flex;flex-wrap:wrap;gap:.3cqw;align-items:center}
.cmp-pre button,.cmp-chips button{font:inherit;font-size:.72cqw;border:1px solid var(--ink);background:var(--surface);padding:.3cqw .55cqw;cursor:pointer;border-radius:0}
.cmp-chips button{border-color:var(--line);color:var(--text)}
.cmp-pre button[aria-pressed="true"],.cmp-chips button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.cmp-table table{border-collapse:collapse;width:100%;font-size:.9cqw;line-height:1.35}
.cmp-table th,.cmp-table td{border-bottom:1px solid var(--line);padding:.42cqw .55cqw;text-align:left;vertical-align:top}
.cmp-table thead th{font-family:var(--serif);font-weight:500;font-size:1.4cqw;color:var(--ink);vertical-align:bottom}
.cmp-table thead th span{display:block}
.cmp-table tbody th{font-size:.62cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);width:9cqw;font-weight:700}
.ico{width:4.2cqw;height:3cqw;display:block}
/* care */
.wdg.care{display:grid;grid-template-columns:1.35fr 1fr;gap:1.2cqw;align-items:center}
.care-art{width:100%;height:auto;max-height:100%}
.art-t{font:500 15px Inter,sans-serif;fill:#7A7366}
.care-steps{list-style:none;margin:0;padding:0;display:grid;gap:.45cqw}
.care-steps button{display:flex;gap:.8cqw;align-items:center;width:100%;text-align:left;font:inherit;font-size:1.05cqw;border:1px solid var(--line);background:var(--paper);padding:.6cqw .8cqw;cursor:pointer;border-radius:0;color:var(--ink)}
.care-steps b{font-family:var(--serif);font-size:1.6cqw;color:var(--gold);font-weight:500;width:1.4cqw}
.care-steps .on button{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}.care-steps .on b{color:var(--gold2)}
.care-steps .done button{border-color:var(--gold)}
@keyframes drip{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(120px);opacity:0}}
@keyframes mist{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(60px,10px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pat{0%,100%{transform:translateX(0)}50%{transform:translateX(150px)}}
.drip{animation:drip 1.2s linear infinite}.mist{animation:mist 1s ease-out infinite}.spin{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}.pat{animation:pat 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.drip,.mist,.spin,.pat{animation:none}}
/* mistakes */
.mistk{display:grid;grid-template-columns:repeat(4,1fr);gap:.7cqw;align-content:start}
.mtile{display:flex;flex-direction:column;align-items:center;gap:.4cqw;border:1px solid var(--line);background:var(--paper);padding:.8cqw;cursor:pointer;font:inherit;font-size:.95cqw;color:var(--ink);border-radius:0;text-align:center}
.mtile svg{width:100%;height:auto;max-height:8cqw}
.mtile.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}.mtile.seen span::after{content:" ✓";color:var(--gold)}
/* options (scenarios, consultation, assessment) */
.opts{display:grid;gap:.5cqw}
.opt{display:flex;gap:.8cqw;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:1.02cqw;line-height:1.4;border:1px solid var(--line);background:var(--paper);padding:.65cqw .85cqw;cursor:pointer;border-radius:0;color:var(--ink)}
.opt b{font-family:var(--serif);font-size:1.4cqw;color:var(--gold);font-weight:500;line-height:1}
.opt small{display:block;font-size:.88cqw;color:var(--text);margin-top:.3cqw}
.opt.ok{border-color:var(--green);box-shadow:inset 3px 0 0 var(--green)}.opt.no{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}.opt.mid{border-color:var(--gold2);box-shadow:inset 3px 0 0 var(--gold2)}
.opt:disabled{cursor:default;opacity:1}
.tf2{grid-template-columns:1fr 1fr}.tf2 .opt{justify-content:center;font-size:1.3cqw}
/* consultation */
.consult{display:flex;flex-direction:column;gap:.7cqw}
.cs-tabs{display:flex;flex-wrap:wrap;gap:.3cqw}
.cs-tabs button{font:inherit;font-size:.78cqw;border:1px solid var(--ink);background:var(--surface);padding:.35cqw .6cqw;cursor:pointer;border-radius:0}
.cs-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.cs-body{display:grid;grid-template-columns:15cqw 1fr;gap:1.1cqw;align-items:start}
.cs-scene{width:15cqw;height:20cqw;border:1px solid var(--line);display:block}
.brief{font-family:var(--serif);font-size:1.5cqw;line-height:1.25;color:var(--ink);margin-bottom:.4cqw}
.qs{display:flex;flex-wrap:wrap;gap:.4cqw}
.qchip{font:inherit;font-size:.92cqw;border:1px solid var(--line);background:var(--paper);padding:.45cqw .7cqw;cursor:pointer;border-radius:0;text-align:left;color:var(--ink)}
.qchip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.qchip small{display:block;font-size:.7cqw;letter-spacing:.08em;text-transform:uppercase;margin-top:.2cqw}
.qchip.good small{color:var(--green)}.qchip.off small{color:var(--red)}
.qchip.good.on{border-color:var(--green)}.qchip.off.on{border-color:var(--red)}
.consult .say{font-size:1.45cqw}
/* assessment */
.as-head{display:flex;justify-content:space-between;font-size:.72cqw;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
.as-prog{height:.3cqw;background:var(--line);margin:.4cqw 0 .8cqw}.as-prog i{display:block;height:100%;background:var(--gold)}
.qpic{width:100%;height:auto;display:block;margin-bottom:.7cqw;border:1px solid var(--line)}
.as-xs{height:24cqw;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center}
.mt{display:grid;gap:.7cqw}
.mt-items{display:flex;flex-wrap:wrap;gap:.4cqw;min-height:2.4cqw}
.mt-i{font:inherit;font-size:.95cqw;border:1px solid var(--ink);background:var(--surface);padding:.45cqw .7cqw;cursor:grab;border-radius:0}
.mt-i.held{background:var(--ink);color:var(--on-ink)}
.mt-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:.5cqw}
.mt-k{border:1px dashed var(--mute);min-height:7cqw;padding:.5cqw;background:var(--paper);display:flex;flex-direction:column;gap:.3cqw;cursor:pointer}
.mt-k p{margin:0 0 .2cqw}.mt-k .kchip{margin:0;font-size:.7cqw}
.mt-p{font-size:.85cqw;border:1px solid var(--line);padding:.25cqw .45cqw;background:var(--surface);cursor:pointer}
.mt-p.ok{border-color:var(--green)}.mt-p.no{border-color:var(--red);text-decoration:line-through}
.hint2{font-size:.85cqw;color:var(--mute)}
.as-res{display:grid;grid-template-columns:14cqw 1fr;gap:1.6cqw;align-items:start}
.ring{width:13cqw;height:13cqw;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;align-content:center;position:relative}
.ring::before{content:"";position:absolute;inset:1.1cqw;border-radius:50%;background:var(--surface)}
.ring b,.ring small{position:relative}.ring b{font-family:var(--serif);font-size:3.2cqw;font-weight:500;color:var(--ink);line-height:1}.ring small{font-size:.8cqw;color:var(--mute)}
.tops{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:.2cqw 1.4cqw;font-size:.95cqw}
.tops li{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:.2cqw 0}.tops li.no span{color:var(--red)}.tops li.ok b{color:var(--green)}
.as-list{margin-top:1cqw;font-size:.9cqw}.as-list summary{cursor:pointer;color:var(--gold);letter-spacing:.06em}
.as-list ol{margin:.5cqw 0 0 1.2cqw;padding:0;line-height:1.4}.as-list li{margin-top:.3cqw}.as-list li.ok::marker{color:var(--green)}.as-list li.no::marker{color:var(--red)}.as-list small{display:block;color:var(--mute)}

/* ---- side tabs on technology slides ---- */
.ttabs{display:flex;flex-wrap:wrap;gap:.25cqw;margin-top:.9cqw}
.ttabs button{font:inherit;font-size:.7cqw;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);background:var(--surface);color:var(--mute);padding:.35cqw .6cqw;cursor:pointer;border-radius:0}
.ttabs button[aria-selected="true"]{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.tpane{display:none;margin-top:.6cqw}.tpane.show{display:block;animation:fadein .35s}
@keyframes fadein{from{opacity:0;transform:translateY(.4cqw)}to{opacity:1;transform:none}}
.tpane ul{margin:0 0 0 1.1cqw;padding:0;font-size:1.08cqw;line-height:1.45}
.tpane .say{font-size:1.5cqw}
.tpane .tcare{font-size:.95cqw;color:var(--mute);margin-top:.5cqw;display:block}

/* ---- section, references and module slides ---- */
.jumps{display:grid;gap:.5cqw;margin-top:1.4cqw}
.jumps .jump{display:grid;grid-template-columns:3.4cqw 1fr;align-items:baseline;border-top:1px solid var(--line);padding:.6cqw 2.6cqw .4cqw 0;cursor:pointer;position:relative;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font:inherit;color:inherit}
.jumps .jump:hover,.jumps .jump:focus-visible{background:var(--raise)}
.jumps .jump::after{content:"›";position:absolute;right:.8cqw;top:50%;transform:translateY(-45%);color:var(--gold);font-size:1.9cqw;font-family:var(--serif)}
.jumps b{font-family:var(--serif);font-size:1.7cqw;font-weight:500;color:var(--gold)}
.jumps span{font-size:1.2cqw;color:var(--ink)}.jumps small{display:block;font-size:.88cqw;color:var(--mute);margin-top:.1cqw}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5cqw;margin-top:1cqw}
.tgrid .jump{display:flex;gap:.6cqw;align-items:center;border:1px solid var(--line);background:var(--surface);padding:.45cqw .6cqw;cursor:pointer;font:inherit;text-align:left;color:var(--ink);border-radius:0}
.tgrid .jump:hover,.tgrid .jump:focus-visible{border-color:var(--ink)}
.tgrid .ico{width:3.2cqw;height:2.3cqw;flex:none}.tgrid span{font-size:.92cqw;line-height:1.2}.tgrid small{display:block;margin-top:.15cqw}.tgrid .kchip{margin-left:0;font-size:.52cqw}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:.6cqw 1.2cqw;margin-top:1.4cqw}
.kinds p{font-size:1.02cqw;line-height:1.4}.kinds .kchip{margin:0 .4cqw 0 0}
.refs{columns:2;column-gap:2.4cqw;font-size:.86cqw;line-height:1.4;margin-top:1.2cqw}
.refs h4{font-size:.62cqw;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:.8cqw 0 .3cqw;break-after:avoid}
.refs p{break-inside:avoid;margin:0 0 .55cqw}.refs a{color:var(--ink);text-decoration:underline;text-underline-offset:2px}.refs small{display:block;color:var(--mute)}
.mods{display:grid;gap:.8cqw;margin-top:1.6cqw}
.mods a,.mods div{display:block;border:1px solid var(--line);background:var(--surface);padding:1cqw 1.2cqw;color:var(--ink);text-decoration:none}
.mods a:hover,.mods a:focus-visible{border-color:var(--ink)}
.mods b{font-family:var(--serif);font-size:1.9cqw;font-weight:500;display:block}.mods small{font-size:.95cqw;color:var(--mute)}
.mods .here{border-color:var(--gold)}.mods .soon{opacity:.6}
.mods em{font-style:normal;font-size:.62cqw;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);float:right}
.sheet .modrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sheet .modrow a,.sheet .modrow span{border:1px solid var(--line);background:var(--surface);padding:8px 12px;font-size:13px;color:var(--ink);text-decoration:none}
.sheet .modrow .here{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}.sheet .modrow span{opacity:.6}
.sheet .refs{font-size:13px;columns:2;column-gap:24px}.sheet .refs h4{font-size:11px}
@media (max-width:700px){.sheet .refs{columns:1}}
.dz-path li.cur{color:var(--ink);font-weight:600}.dz-path li.cur b{color:var(--ink)}.dz-path li.todo{color:var(--faint)}
.decide .dz-card{padding:2cqw 2.2cqw}.decide .dz-card h3{font-size:2.8cqw}.decide .dz-btns .sbtn{font-size:1.1cqw;padding:.8cqw 1.8cqw}
.decide .dz-path li{font-size:1cqw;padding:.45cqw 0}
.L-title>div:nth-child(2){padding-right:3cqw}

  function check(q, r) {

  }

})();

  const sTilt = slider("Head tilt", 0, 90, st.tilt, (v) => set("tilt", v, true), (v) => v + "°");

SIMS.careq = (host, ctx) => {
  const Q = L.careQuiz, res = {}; let i = 0;
  const wrap = h(`<div class="wdg careq"></div>`); host.appendChild(wrap);
  function render() { const q = Q[i], r = res[i];
    wrap.innerHTML = `<p class="eyebrow">Scenario ${i + 1} of ${Q.length}</p><h3>${esc(q.s)}</h3><div class="opts">${q.o.map((o, k) => `<button type="button" class="opt ${r != null ? (k === q.a ? "ok" : k === r ? "no" : "") : ""}" data-k="${k}" ${r != null ? "disabled" : ""}><b>${"ABC"[k]}</b>${esc(o)}</button>`).join("")}</div>${r != null ? `<p class="fb ${r === q.a ? "ok" : "no"}">${r === q.a ? "Safest choice." : "Not the safest."} ${esc(q.e)}</p>` : ""}<div class="dz-btns">${i > 0 ? `<button type="button" class="sbtn ghost" data-n="-1">‹ Previous</button>` : ""}${i < Q.length - 1 ? `<button type="button" class="sbtn ${r != null ? "ink" : ""}" data-n="1">Next scenario ›</button>` : ""}</div>`;
    const ok = Object.entries(res).filter(([k, v]) => v === Q[k].a).length;
    live(ctx, `<p class="sec">Score</p><p class="big-s">${ok}<small>/${Object.keys(res).length} answered</small></p><p class="note">${esc(L.careNote)}</p>`); }
  function ans(k) { if (res[i] != null) return; res[i] = k; render(); ctx.changed(); }
  function nav(d) { i = clamp(i + d, 0, Q.length - 1); render(); ctx.changed(); }
  wrap.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.k != null) ans(+b.dataset.k); else if (b.dataset.n) nav(+b.dataset.n); });
  render();
  return { acts: () => [...(res[i] == null ? Q[i].o.map((o, k) => ["a:" + k, "ABC"[k] + " · " + o]) : []), ...(i < Q.length - 1 ? [["n:1", "Next scenario"]] : []), ...(i ? [["n:-1", "Previous"]] : [])], act(a) { const [k, v] = a.split(":"); k === "a" ? ans(+v) : nav(+v); }, destroy: () => wrap.remove() };
};

/* ---------- F · consultation simulator ---------- */
const CONS_SCENE = { drive: "road", fish: "water", office: "office", travel: "city", premium: "beach", sport: "golf" };
SIMS.consult = (host, ctx) => {
  const CS = L.consult; let cur = 0, phase = "ask", asked = new Set(), checked = false, choice = null; const done = new Set();
  const wrap = h(`<div class="wdg consult"><div class="cs-tabs" role="group" aria-label="Customers"></div><div class="cs-body"><canvas class="cs-scene" aria-hidden="true"></canvas><div class="cs-main"></div></div></div>`); host.appendChild(wrap);
  const tabs = wrap.querySelector(".cs-tabs"), main = wrap.querySelector(".cs-main"), cv = wrap.querySelector(".cs-scene");
  function scene() { const c = CS[cur], r = cv.getBoundingClientRect(); if (!r.width) return; const dpr = Math.min(2, devicePixelRatio || 1); cv.width = r.width * dpr; cv.height = r.height * dpr; const g = cv.getContext("2d"), W = 1140, H = Math.round(W * r.height / r.width); g.setTransform(cv.width / W, 0, 0, cv.width / W, 0, 0); paintScene(g, W, H, 1200, { kind: CONS_SCENE[c.scene], glare: 1, cut: 0, hy: c.scene === "office" ? 0 : .42 }); }
  function render() { const c = CS[cur];
    tabs.innerHTML = CS.map((x, k) => `<button type="button" data-c="${k}" aria-pressed="${k === cur}">${done.has(k) ? "✓ " : ""}${esc(x.n)}</button>`).join("");
    let body = `<p class="eyebrow">Customer ${cur + 1} · ${esc(c.n)}</p><p class="brief">${esc(c.brief)}</p>`;
    if (phase === "ask") body += `<p class="sec">1 · Which questions would you ask? <small>tap all that help</small></p><div class="qs">${c.qs.map(([q, good], k) => `<button type="button" class="qchip ${asked.has(k) ? "on" : ""} ${checked ? (good ? "good" : "off") : ""}" data-q="${k}" aria-pressed="${asked.has(k)}">${esc(q)}${checked ? `<small>${good ? "needs-based" : "not about their needs"}</small>` : ""}</button>`).join("")}</div><div class="dz-btns">${!checked ? `<button type="button" class="sbtn ink" data-a="check">Check my questions</button>` : `<button type="button" class="sbtn ink" data-a="rec">2 · Recommend ›</button>`}</div>`;
    else { body += `<p class="sec">2 · Which recommendation fits best?</p><div class="opts">${c.opts.map((o, k) => `<button type="button" class="opt ${choice != null ? (o.best ? "ok" : o.ok ? "mid" : k === choice ? "no" : "") : ""}" data-o="${k}" ${choice != null ? "disabled" : ""}><b>${"ABCD"[k]}</b><span>${esc(o.t)}${choice != null ? `<small>${o.best ? "Strongest fit — " : o.ok ? "Acceptable — " : "Trade-off — "}${esc(o.why)} ${refLink(o.ref)}</small>` : ""}</span></button>`).join("")}</div>`;
      if (choice != null) body += `<p class="sec">Say it like this</p><p class="say">${esc(c.say)}</p>`;
      body += `<div class="dz-btns"><button type="button" class="sbtn ghost" data-a="ask">‹ Questions</button>${choice != null && cur < CS.length - 1 ? `<button type="button" class="sbtn ink" data-a="next">Next customer ›</button>` : ""}</div>`; }
    main.innerHTML = body;
    live(ctx, `<p class="sec">Needs-based selling</p><p class="txt">Ask before you recommend. Explain why the strongest option fits and be open about trade-offs. Never default to the most expensive lens.</p><p class="sec">Progress</p><p class="big-s">${done.size}<small>/${CS.length} customers</small></p>`);
    requestAnimationFrame(scene);
  }
  function setCust(k) { cur = k; phase = "ask"; asked = new Set(); checked = false; choice = null; render(); ctx.changed(); }
  wrap.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.c != null) setCust(+b.dataset.c);
    else if (b.dataset.q != null) { const k = +b.dataset.q; asked.has(k) ? asked.delete(k) : asked.add(k); render(); }
    else if (b.dataset.o != null) { choice = +b.dataset.o; if (CS[cur].opts[choice].best) done.add(cur); render(); ctx.changed(); }
    else if (b.dataset.a === "check") { checked = true; render(); ctx.changed(); }
    else if (b.dataset.a === "rec") { phase = "rec"; render(); ctx.changed(); }
    else if (b.dataset.a === "ask") { phase = "ask"; render(); ctx.changed(); }
    else if (b.dataset.a === "next") setCust(cur + 1); });
  let ro; try { ro = new ResizeObserver(scene); ro.observe(cv); } catch (e) {}
  render();
  return { acts: () => [...CS.map((c, k) => ["c:" + k, c.n, k === cur]), ...(phase === "ask" ? [checked ? ["rec", "Go to recommendation"] : ["check", "Check questions"]] : choice == null ? CS[cur].opts.map((o, k) => ["o:" + k, "ABCD"[k] + " · " + o.t]) : [])],
    act(a) { const [k, v] = a.split(":"); if (k === "c") setCust(+v); else if (k === "o") { choice = +v; if (CS[cur].opts[choice].best) done.add(cur); render(); } else if (k === "check") { checked = true; render(); } else if (k === "rec") { phase = "rec"; render(); } },
    destroy: () => { try { ro && ro.disconnect(); } catch (e) {} wrap.remove(); } };
};

/* ---------- G · assessment (presentation only; logic in Assess) ---------- */
SIMS.assess = (host, ctx) => {
  let S = Assess.session(ASSESS_BANK), pending = null, match = {}, held = null;
  const wrap = h(`<div class="wdg assess"></div>`); host.appendChild(wrap);
  let last = null; try { last = JSON.parse(localStorage.getItem("ilg-lens-assess") || "null"); } catch (e) {}
  function picture(q) { const c = document.createElement("canvas"); c.className = "qpic"; c.width = 1140; c.height = 420; const g = c.getContext("2d");
    if (q.pic.k === "pair") { [0, 1].forEach((s) => { g.save(); g.beginPath(); g.rect(s * 580, 0, 560, 420); g.clip(); g.translate(s * 580, 0); g.scale(560 / 1140, 1); paintScene(g, 1140, 420, 900, { kind: "water", glare: 1, cut: s, hy: .2 }); if (s) KIT.tintRect(g, 0, 0, 1140, 420, [100, 86, 66], .4); g.restore(); KIT.pill(g, s ? "Right" : "Left", s * 580 + 20, 30, { size: 20 }); }); }
    else { g.fillStyle = "#E8E1D4"; g.fillRect(0, 0, 1140, 420); [470, 670].forEach((x) => { g.fillStyle = "rgba(80,70,58,.45)"; g.beginPath(); g.arc(x, 210, 160, 0, 7); g.fill(); }); g.save(); g.beginPath(); g.arc(470, 210, 160, 0, 7); g.clip(); g.fillStyle = "rgba(8,8,8,.9)"; g.beginPath(); g.arc(670, 210, 160, 0, 7); g.fill(); g.restore(); [470, 670].forEach((x) => { g.strokeStyle = "#16140F"; g.lineWidth = 8; g.beginPath(); g.arc(x, 210, 160, 0, 7); g.stroke(); }); KIT.pill(g, "turned 90°", 770, 40, { size: 20 }); }
    return c; }
  function render() {
    if (Assess.done(S)) return results();
    const q = S.bank[S.i], r = S.res[q.id];
    let body = `<div class="as-head"><span>Question ${S.i + 1} of ${S.bank.length}</span><span>${esc(q.topic)}</span></div><div class="as-prog"><i style="width:${(S.i / S.bank.length) * 100}%"></i></div><h3>${esc(q.q)}</h3><div class="as-body"></div>`;
    wrap.innerHTML = body; const B = wrap.querySelector(".as-body");
    if (q.type === "pic") B.appendChild(picture(q));
    if (q.type === "mcq" || q.type === "pic") B.insertAdjacentHTML("beforeend", `<div class="opts">${q.o.map((o, k) => `<button type="button" class="opt ${r ? (k === q.a ? "ok" : k === r.r ? "no" : "") : ""}" data-r="${k}" ${r ? "disabled" : ""}><b>${"ABCD"[k]}</b>${esc(o)}</button>`).join("")}</div>`);
    if (q.type === "tf") B.insertAdjacentHTML("beforeend", `<div class="opts tf2">${[["1", "True"], ["0", "False"]].map(([v, t]) => `<button type="button" class="opt ${r ? ((v === "1") === q.a ? "ok" : (v === "1") === r.r ? "no" : "") : ""}" data-r="${v}" ${r ? "disabled" : ""}>${t}</button>`).join("")}</div>`);
    if (q.type === "layer") { const all = new Set(L.presets.sun.on); B.insertAdjacentHTML("beforeend", `<div class="as-xs">${SIMS._xsec(all, r ? q.a : null, { noLabels: !r })}</div>`); }
    if (q.type === "match") { B.insertAdjacentHTML("beforeend", `<div class="mt"><div class="mt-items">${q.items.filter(([lab]) => !match[lab]).map(([lab]) => `<button type="button" class="mt-i ${held === lab ? "held" : ""}" draggable="true" data-mi="${esc(lab)}">${esc(lab)}</button>`).join("")}</div><div class="mt-keys">${q.keys.map((k) => `<div class="mt-k" data-k="${k}" tabindex="0" role="button" aria-label="Drop on ${esc(L.kinds[k].n)}"><p>${kindChip(k)}</p>${Object.entries(match).filter(([, v]) => v === k).map(([lab]) => { const ok = r ? q.items.find((x) => x[0] === lab)[1] === k : null; return `<span class="mt-p ${ok == null ? "" : ok ? "ok" : "no"}" data-u="${esc(lab)}">${esc(lab)}</span>`; }).join("")}</div>`).join("")}</div>${!r ? `<p class="hint2">Drag each item onto its type — or tap an item, then tap the type.</p><div class="dz-btns"><button type="button" class="sbtn ink" data-check ${Object.keys(match).length < q.items.length ? "disabled" : ""}>Check</button></div>` : ""}</div>`); }
    if (r) B.insertAdjacentHTML("beforeend", `<p class="fb ${r.ok ? "ok" : r.score > 0 ? "mid" : "no"}">${r.ok ? "Correct." : r.score > 0 ? `Partly right (${Math.round(r.score * 100)}%).` : "Not quite."} ${esc(q.e)}</p><div class="dz-btns"><button type="button" class="sbtn ink" data-next>${S.i < S.bank.length - 1 ? "Next question ›" : "See results ›"}</button></div>`);
    live(ctx, `<p class="sec">Assessment</p><p class="txt">${S.bank.length} questions, mixed types: pictures, true/false, drag-and-drop, the cross-section and customer scenarios. Immediate feedback after each answer.</p>${last ? `<p class="sec">Last attempt on this device</p><p class="txt">${Math.round(last.pct * 100)}% · ${esc(last.status)}</p>` : ""}`);
  }
  function results() { const R = Assess.results(S), pct = Math.round(R.pct * 100);
    try { localStorage.setItem("ilg-lens-assess", JSON.stringify({ pct: R.pct, status: R.status, at: Date.now() })); } catch (e) {}
    const secName = (id) => { const s = (window.DECK && DECK.SLIDES || []).find((x) => x.id === id); return s && DECK.titleOf ? DECK.titleOf(s) : id; };
    wrap.innerHTML = `<div class="as-res"><div class="ring" style="--p:${pct}"><b>${pct}%</b><small>${R.score} / ${R.max}</small></div><div><p class="eyebrow">${esc(R.status)}</p><h3>${R.passed ? "Well done." : R.pct >= .5 ? "Good effort — a little revision." : "Let’s revisit the key sections."}</h3>
      <p class="sec">Topics</p><ul class="tops">${R.topics.map((t) => `<li class="${t.got / t.n >= Assess.PASS ? "ok" : "no"}"><span>${esc(t.topic)}</span><b>${Math.round(t.got * 10) / 10}/${t.n}</b></li>`).join("")}</ul>
      ${R.sections.length ? `<p class="sec">Revisit</p><div class="dz-btns">${R.sections.map((s) => `<button type="button" class="sbtn" data-go="${esc(s)}">${esc(secName(s))} ›</button>`).join("")}</div>` : ""}
      <div class="dz-btns" style="margin-top:1cqw"><button type="button" class="sbtn ink" data-again>Retake</button></div></div></div>
      <details class="as-list"><summary>Answers: ${R.correct.length} correct · ${R.wrong.length} to review</summary><ol>${S.bank.map((q) => { const r = S.res[q.id]; return `<li class="${r && r.ok ? "ok" : "no"}">${esc(q.q)} <small>${esc(q.e)}</small></li>`; }).join("")}</ol></details>`;
    live(ctx, `<p class="sec">Result</p><p class="big-s">${pct}%<small> ${esc(R.status)}</small></p>${R.revise.length ? `<p class="sec">Revise</p><p class="txt">${R.revise.map(esc).join(" · ")}</p>` : `<p class="txt">No topics below ${Assess.PASS * 100}%.</p>`}`);
  }
  function answer(v) { const q = S.bank[S.i]; if (!q || S.res[q.id]) return; Assess.answer(S, v); render(); ctx.changed(); }
  function next() { match = {}; held = null; Assess.next(S); render(); ctx.changed(); }
  function place(lab, key) { const q = S.bank[S.i]; if (!q || q.type !== "match" || S.res[q.id]) return; match[lab] = key; held = null; render(); ctx.changed(); }
  wrap.addEventListener("click", (e) => { const t = e.target;
    const b = t.closest("[data-r]"); if (b) { const q = S.bank[S.i]; return answer(q.type === "tf" ? b.dataset.r === "1" : +b.dataset.r); }
    if (t.closest("[data-next]")) return next();
    if (t.closest("[data-again]")) { S = Assess.session(ASSESS_BANK); match = {}; render(); ctx.changed(); return; }
    const gg = t.closest("[data-go]"); if (gg) return ctx.go(gg.dataset.go);
    const l = t.closest(".as-xs [data-l]"); if (l) return answer(l.dataset.l);
    const it = t.closest("[data-mi]"); if (it) { held = it.dataset.mi; render(); return; }
    const u = t.closest("[data-u]"); if (u && !held && !S.res[S.bank[S.i].id]) { delete match[u.dataset.u]; render(); return; }
    const k = t.closest("[data-k]"); if (k && held) return place(held, k.dataset.k);
    if (t.closest("[data-check]")) return answer(Object.assign({}, match)); });
  wrap.addEventListener("keydown", (e) => { if (e.key !== "Enter" && e.key !== " ") return; const l = e.target.closest && e.target.closest(".as-xs [data-l]"), k = e.target.closest && e.target.closest("[data-k]"); if (l) { e.preventDefault(); e.stopPropagation(); answer(l.dataset.l); } else if (k && held) { e.preventDefault(); e.stopPropagation(); place(held, k.dataset.k); } });
  wrap.addEventListener("dragstart", (e) => { const it = e.target.closest("[data-mi]"); if (it) { e.dataTransfer.setData("text/plain", it.dataset.mi); held = it.dataset.mi; } });
  wrap.addEventListener("dragover", (e) => { if (e.target.closest("[data-k]")) e.preventDefault(); });
  wrap.addEventListener("drop", (e) => { const k = e.target.closest("[data-k]"); if (!k) return; e.preventDefault(); const lab = e.dataTransfer.getData("text/plain") || held; if (lab) place(lab, k.dataset.k); });
  render();
  return {
    acts() { if (Assess.done(S)) return [["again", "Retake"]]; const q = S.bank[S.i], r = S.res[q.id]; if (r) return [["next", S.i < S.bank.length - 1 ? "Next question" : "See results"]];
      if (q.type === "mcq" || q.type === "pic") return q.o.map((o, k) => ["r:" + k, "ABCD"[k] + " · " + o]);
      if (q.type === "tf") return [["r:1", "True"], ["r:0", "False"]];
      if (q.type === "layer") return L.layers.map((l) => ["l:" + l.id, l.n.split(" (")[0]]);
      return Object.keys(match).length === q.items.length ? [["check", "Check matches"]] : []; },
    act(a) { const [k, v] = a.split(":"); const q = S.bank[S.i];
      if (k === "r") answer(q.type === "tf" ? v === "1" : +v); else if (k === "l") answer(v); else if (k === "next") next(); else if (k === "check") answer(Object.assign({}, match)); else if (k === "again") { S = Assess.session(ASSESS_BANK); match = {}; render(); } },
    destroy: () => wrap.remove() };
};
})();
</script>
<script>const MERIDIAN_URL = "https://ilgquiz.vercel.app";
const CALIBRE_URL = "./";
/* =====================================================================
   ILG Academy · Eyewear Lens Technology — training deck
   The same engine as the Watch Anatomy deck (anatomy-deck.html):
   slides with steps, presenter clicker, presenter view, contents,
   black screen, swipe, and Caliber Remote on a phone (direct link with

   in-page simulations (sims-*.js) that expose their controls to the

   Content: content.js · Assessment logic: assess.js
   ===================================================================== */
(function () {
"use strict";
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const H = new URLSearchParams(location.hash.slice(1));

const PEER_PARAM = new URLSearchParams(location.search).get("peer") || H.get("peer") || "";

  const [host, port] = PEER_PARAM.split(":"); return { host, port: +port || 443, path: "/", secure: !/^(localhost|127\.|192\.168\.|10\.)/.test(host) && +port !== 9000, debug: 0 }; })();
const CH_NAME = "ilg-lens-deck";
const PFX = "lns-";
const DECK_VERSION = "v1 · Oct 2026";
const toastEl = document.createElement("div"); toastEl.className = "toast"; toastEl.setAttribute("role", "status"); document.body.appendChild(toastEl);
let toastT = 0;

/* ---------------- slides (words come from LENS in content.js) ---------------- */
const T = LENS.slides, TX = LENS.tech;
const refLink = (k) => (k && REFS[k] ? ` <a class="ref" href="${esc(REFS[k].u)}" target="_blank" rel="noopener" title="${esc(REFS[k].t)}">source</a>` : "");

const splitSide = (k, body = "") => `<div class="side"><p class="eyebrow">${esc(T[k].eyebrow)}</p><h2>${esc(T[k].h)}</h2>${body}<div data-live></div></div>`;

  html: () => `<div><p class="eyebrow">${esc(T.title.eyebrow)}</p><h1>${esc(T.title.h)}</h1><p class="lead">${esc(T.title.lead)}</p><p class="cta">${esc(T.title.cta)}</p></div><div class="fig" style="height:62cqh"><span data-fig></span></div>`,
  notes: T.title.notes });
const PARTS = [["A", "Polarised lenses", "Glare, the filter, the simulator, who it suits, testing, myths", "glare"], ["B", "13 lens technologies", "Coatings, filters, tints and materials", "secB"], ["C", "Lens anatomy", "A conceptual cross-section", "anat"], ["D", "Comparison lab", "Any two or three, side by side", "comp"], ["E", "Lens care", "The safe sequence and common mistakes", "care"], ["F", "Consultation", "Six customers, needs-based", "cons"], ["G", "Assessment", "Applied questions with feedback", "assess"]];
add({ id: "agenda", sec: "Start", layout: "L-list",
  html: () => `<div><p class="eyebrow">${esc(T.agenda.eyebrow)}</p><h2>${esc(T.agenda.h)}</h2><div class="jumps">${PARTS.map(([n, a, b, id]) => `<button type="button" class="jump" data-jump="${id}"><b>${n}</b><span>${esc(a)}<small>${esc(b)}</small></span></button>`).join("")}</div></div>
    <div><p class="eyebrow">ILG Academy modules</p><div class="mods">${MODULES.map((m) => m.here ? `<div class="here"><em>You are here</em><b>${esc(m.name)}</b><small>${esc(m.note)}</small></div>` : m.href ? `<a href="${esc(m.href)}"><em>Open ›</em><b>${esc(m.name)}</b><small>${esc(m.note)}</small></a>` : `<div class="soon"><em>Coming</em><b>${esc(m.name)}</b><small>${esc(m.note)}</small></div>`).join("")}</div>
    <div class="keys" style="margin-top:1.6cqw;font-size:.95cqw"><kbd>→ / clicker</kbd><span>Next step, then next slide</span><kbd>R</kbd><span>Phone remote</span><kbd>O</kbd><span>Contents</span><kbd>P</kbd><span>Presenter view</span></div></div>`,

}
function unmountSim(i) { const s = slideEl(i), host = s && $("[data-sim-host]", s); if (!host) return; const sp = document.createElement("span"); sp.setAttribute("data-fig", ""); host.replaceWith(sp); }

/* what steps and remotes can do */
const API = {

/* ---------------- keys (keyboard and presenter clickers) ---------------- */
let digits = "";
function key(e) {

  if ((k === " " || k === "Enter") && ae.closest && ae.closest("#deck") && ae.matches("button,[role=button],summary,a,[tabindex]")) return;
  if (!$("#ovl").hidden && k === "Escape") { closeOvl(); return; }
  if (/^[0-9]$/.test(k)) { digits += k; toast("Go to slide " + digits + " · Enter"); return; }
  if (k === "Enter" && digits) { go(+digits - 1); digits = ""; return; }
  if (black && !["b", "B", ".", "Escape"].includes(k)) { setBlack(false); return; }

function onCmd(m) {

  const c = m.cmd;
  if (c === "next") next(); else if (c === "prev") prev(); else if (c === "skip") go(cur + 1); else if (c === "goto") go(+m.n);
  else if (c === "black") setBlack(!black); else if (c === "step") runTo(+m.k + 1);
  else if (c === "hello") sendState();

}
if (bc) bc.onmessage = (e) => { if (ROLE === "deck") onCmd(e.data); };
/* ---------- backup link: a public relay (MQTT over a secure WebSocket) for networks that block direct phone-to-laptop links ---------- */
const RELAY_PARAM = new URLSearchParams(location.search).get("relay") || H.get("relay") || "";
const RELAYS = RELAY_PARAM ? [RELAY_PARAM] : ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt", "wss://test.mosquitto.org:8081/mqtt"];
const relayTopic = (id, k) => "ilg-lens-tech/" + id + "/" + k;

    ws.onopen = () => ws.send(pkt(0x10, [...str("MQTT"), 4, 0x02, 0, 60, ...str("lns" + Math.random().toString(36).slice(2, 12))]));

const relays = [], relayClients = new Map();
function countRemotes() { const now = Date.now(); for (const [k, t] of relayClients) if (now - t > 15000) relayClients.delete(k);
  const before = remotes; remotes = [...conns].filter((x) => x.open).length + relayClients.size; if (remotes !== before) { dots(); renderRemotePanel(); } }
function startRelay() {
  if (relays.length || ROLE !== "deck" || typeof WebSocket === "undefined") return;
  const id = deckId();
  RELAYS.forEach((u) => { const r = mqttLink(u, (t, m) => { if (!m || !m.cmd) return; if (m.from) { const isNew = !relayClients.has(m.from); relayClients.set(m.from, Date.now()); if (isNew) { toast("Phone remote connected"); countRemotes(); } } if (m.cmd === "ping") return; if (m.cmd === "bye") { relayClients.delete(m.from); countRemotes(); return; } onCmd(m); }, () => renderRemotePanel());
    r.subscribe(relayTopic(id, "cmd")); relays.push(r); });
}
setInterval(() => { if (ROLE === "deck" && relays.length) countRemotes(); }, 4000);
function deckId() {

  if (!id) { id = PFX + Array.from(crypto.getRandomValues(new Uint8Array(6))).map((b) => "abcdefghjkmnpqrstuvwxyz23456789"[b % 31]).join(""); try { sessionStorage.setItem("lnsPeerId", id); } catch (e) {} }
  peerId = id; return id;
}
function startPeer() {
  if (peer || typeof Peer === "undefined") return;
  const id = deckId(); peerErr = "";
  try { peer = new Peer(id, PEERCFG); } catch (e) { peerErr = String(e); renderRemotePanel(); return; }

  peer.on("error", (e) => { peerErr = (e && e.type) || String(e); if (e && e.type === "unavailable-id") { try { sessionStorage.removeItem("lnsPeerId"); } catch (x) {} } renderRemotePanel(); });

  peer.on("connection", (c) => { conns.add(c); c.on("open", () => { countRemotes(); toast("Phone remote connected"); sendState(); });
    c.on("data", (m) => onCmd(m)); c.on("close", () => { conns.delete(c); countRemotes(); toast("Phone remote disconnected"); }); });
}
const dots = () => $$("[data-rdot]").forEach((d) => d.classList.toggle("on", remotes > 0));
const remoteUrl = () => location.origin + location.pathname + location.search + "#remote=" + peerId.replace(PFX, "") + (PEER_PARAM ? "&peer=" + PEER_PARAM : "") + (RELAY_PARAM ? "&relay=" + encodeURIComponent(RELAY_PARAM) : "");
function openRemotePanel() { const o = $("#ovl"); o.hidden = false; o.dataset.kind = "remote"; o.onclick = (e) => { if (e.target.closest("[data-x]") || e.target === o) closeOvl(); if (e.target.closest("[data-pres]")) openPresenter(); }; if (location.protocol !== "file:") { startPeer(); startRelay(); } renderRemotePanel(); }
function renderRemotePanel() {

  if (location.protocol === "file:") body = `<p>The phone remote needs the deck to be opened from its <b>web address</b> (for example after uploading it to the Calibre site), not as a file on this computer — a phone cannot open a file on your laptop.</p><p>On this computer you can still use the <b>presenter view</b> and any presenter clicker.</p>`;
  else {

    const links = `<p style="font-size:13px;color:var(--mute)">Links: direct ${direct ? "<b style='color:#3E7A4A'>ready</b>" : directDown ? "blocked here" : "starting…"} · backup relay ${relayOk ? "<b style='color:#3E7A4A'>ready</b>" : relayDown ? "blocked here" : "starting…"}. The phone uses whichever works.</p>`;
    if (direct || relayOk) body = `<div class="row"><div class="qr">${qrSvg(remoteUrl())}</div><div style="flex:1;min-width:240px"><p><b>Scan with the phone camera.</b> The phone becomes Caliber Remote: next and back, every demonstration's controls, the tabs and the quiz answers.</p><p>Or open the deck on the phone and enter the code <code style="font-size:20px;letter-spacing:.2em">${esc(peerId.replace(PFX, "").toUpperCase())}</code></p>${links}<p style="font-size:13px;color:var(--mute)">Connected phones: ${remotes}. Keep this code to the trainer: anyone with it can control the deck. Leave this deck open; you can close this panel.</p></div></div>`;
    else if (directDown && relayDown) body = `<p><b>This network blocks both phone links.</b> Use a presenter clicker or the presenter view on this computer — or connect the laptop to a phone hotspot and press R again.</p>${links}`;

/* ---------------- QR ---------------- */
function qrSvg(text) { try { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); } catch (e) { return ""; } }

/* =====================================================================
   REMOTE / PRESENTER UI
   ===================================================================== */
function remoteApp(mode) {
  document.body.style.background = "var(--paper)";
  $("#app").remove();
  const R = $("#rmt"); R.hidden = false; if (mode === "presenter") R.classList.add("pres");
  let S = null, send = () => {}, status = "Connecting…", ok = false, t0 = Date.now();
  if (mode === "presenter") { if (bc) { send = (m) => bc.postMessage(m); bc.onmessage = (e) => { if (e.data && e.data.state) { S = e.data.state; ok = true; status = "Linked to the deck"; draw(); } }; send({ cmd: "hello" }); } else status = "This browser cannot link windows"; draw(); }
  else {
    let code = (H.get("remote") || "").toLowerCase();
    const me = "ph" + Math.random().toString(36).slice(2, 10);
    let conn = null, relay = null, via = "", peerObj = null, relayList = [], pingT = 0, failT = 0;
    const setVia = (v) => { if (!ok || via !== v) { via = v; ok = true; status = v === "direct" ? "Connected · direct" : "Connected · relay"; } };

      status = "Connecting…"; draw();
      if (typeof Peer !== "undefined") {
        const p = new Peer(undefined, PEERCFG); peerObj = p;
        p.on("open", () => { const c = p.connect(PFX + code, { reliable: true });
          c.on("open", () => { conn = c; c.send({ cmd: "hello" }); });
          c.on("data", (m) => gotState(m, "direct"));
          c.on("close", () => { if (conn === c) conn = null; if (via === "direct") { ok = false; status = relay && relay.ok ? "Connected · relay" : "Reconnecting…"; if (relay && relay.ok) { via = "relay"; ok = true; relay.publish(relayTopic(PFX + code, "cmd"), { cmd: "hello", from: me }); } draw(); } }); });
        p.on("error", () => {});
      }
      RELAYS.forEach((u) => { const r = mqttLink(u, (t, m) => { if (relay === r) gotState(m, conn && conn.open ? "direct" : "relay"); }, (on) => {
        if (on && !relay) { relay = r; r.subscribe(relayTopic(PFX + code, "state")); setTimeout(() => r.publish(relayTopic(PFX + code, "cmd"), { cmd: "hello", from: me }), 300); relayList.filter((x) => x !== r).forEach((x) => x.close()); }
        else if (on && relay === r) { r.publish(relayTopic(PFX + code, "cmd"), { cmd: "hello", from: me }); } }); relayList.push(r); });
      clearInterval(pingT); pingT = setInterval(() => { if (relay && relay.ok) relay.publish(relayTopic(PFX + code, "cmd"), { cmd: "ping", from: me }); }, 5000);
      clearTimeout(failT); failT = setTimeout(() => { if (!ok) { status = "Can't reach the deck yet. On the big screen press R (or the Phone button) so the QR code is showing, check the code, then tap here to retry."; draw(); } }, 15000);
    };
    window.addEventListener("pagehide", () => { if (relay && relay.ok) relay.publish(relayTopic(PFX + code, "cmd"), { cmd: "bye", from: me }); });
    R.addEventListener("click", (e) => { if (e.target.closest("[data-retry]")) connect(); });
    if (code) connect(); else draw();
    R.addEventListener("submit", (e) => { e.preventDefault();
      const v = (R.querySelector("input") || {}).value || ""; code = v.trim().toLowerCase().replace(PFX, ""); if (code) { history.replaceState(null, "", "#remote=" + code + (PEER_PARAM ? "&peer=" + PEER_PARAM : "") + (RELAY_PARAM ? "&relay=" + encodeURIComponent(RELAY_PARAM) : "")); connect(); } });

/* ---------------- on-screen control bar (mouse and touch) ---------------- */
const ICON = { home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>', menu: '<path d="M4 6h16M4 12h16M4 18h16"/>', prev: '<path d="M15 5l-7 7 7 7"/>', next: '<path d="M9 5l7 7-7 7"/>',
  full: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>', phone: '<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/>', pres: '<rect x="3" y="4" width="21" height="12" rx="1"/><path d="M8 20h8M12 16v4"/>', help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7M12 17h.01"/>', exit: '<path d="M14 4h5a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-5M10 16l-4-4 4-4M6 12h10"/>', book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>' };

    <button data-k="prev" title="Previous slide (←)" class="nav" aria-label="Previous">${ico("prev")}</button><span class="cnt" data-cnt></span><button data-k="next" title="Next step or slide (→)" class="nav go" aria-label="Next">${ico("next")}</button><i class="sep"></i>
    <button data-k="full" title="Full screen (F)">${ico("full")}<span>Full screen</span></button><button data-k="phone" title="Phone remote: scan a QR code (R)">${ico("phone")}<span>Phone</span></button><button data-k="pres" title="Presenter view with notes (P)">${ico("pres")}<span>Presenter</span></button><button data-k="src" title="Sources (S)">${ico("book")}<span>Sources</span></button><button data-k="help" title="How to use this deck (?)">${ico("help")}<span>Help</span></button><i class="sep"></i>
    <a data-k="exit" href="${CALIBRE_URL}" title="Leave the deck and go back to Calibre">${ico("exit")}<span>Exit</span></a>`;
  document.body.appendChild(n);
  n.addEventListener("click", (e) => { const b = e.target.closest("[data-k]"); if (!b) return;
    const k = b.dataset.k; if (k === "exit") return;
    ({ home: () => go(0), menu: openOverview, prev, next, full: fullscreen, phone: openRemotePanel, pres: openPresenter, src: openSources, help: openHelp })[k](); showCtrl(); });
  let t = 0;
  const app = $("#app");
  function showCtrl() { n.classList.add("on"); app.classList.remove("idle"); clearTimeout(t); t = setTimeout(() => { if (!n.matches(":hover") && !n.contains(document.activeElement)) { n.classList.remove("on"); app.classList.add("idle"); } }, 3200); }

}
function ctrlUI() { const c = $("[data-cnt]"); if (c) c.textContent = (cur + 1) + " / " + N;
  const p = $('#ctrl [data-k="prev"]'), x = $('#ctrl [data-k="next"]'); if (p) p.disabled = cur <= 0; if (x) x.disabled = cur >= N - 1 && !(SLIDES[cur].steps && step < SLIDES[cur].steps.length); }
/* swipe between slides on touch screens (figures keep their own drags) */
(function swipe() { let sx = null, sy = 0; document.addEventListener("touchstart", (e) => { if (ROLE !== "deck" || e.touches.length !== 1 || e.target.closest(".fig,#ctrl,.ovl")) { sx = null; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  document.addEventListener("touchend", (e) => { if (sx == null) return; const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; sx = null; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) dx < 0 ? next() : prev(); }, { passive: true }); })();

/* ---------------- start ---------------- */
if (ROLE === "deck") {
  buildSlides(); buildCtrl();
  document.addEventListener("keydown", key);
  const s0 = Math.max(1, +(H.get("slide") || 1)); go(s0 - 1, { force: true });
  window.DECK = { go, next, prev, goId, titleOf, get cur() { return cur; }, get step() { return step; }, SLIDES, snapshot, onCmd, API, get sim() { return simInst; }, startPeer, get peerId() { return peerId; }, get remotes() { return remotes; } };
} else remoteApp(ROLE);
})();
